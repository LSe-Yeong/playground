spring:
  datasource:
    url: jdbc:h2:mem:playground;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    show-sql: true

playground:
  # 개발 중에는 Vite(5173) 등 포트가 바뀌므로 패턴으로 받는다
  allowed-origins:
    - http://localhost:*
    - http://127.0.0.1:*
  session:
    cookie-secure: false
