# 이 컨테이너는 빌드된 정적 파일만 내보낸다. 바깥 nginx 가 앞에서 받아 넘긴다.
# 앱이 /pg/ 아래에 놓이므로 파일도 그 깊이에 두고, 경로를 떼지 않고 그대로 받는다.
server {
    listen 5174;
    server_name _;
    root /usr/share/nginx/html;

    # 번들 파일명에 해시가 붙어 있어 내용이 바뀌면 이름이 바뀐다. 오래 캐시해도 안전하다.
    location /pg/assets/ {
        # expires 와 add_header 를 같이 쓰면 Cache-Control 이 두 번 나간다
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 은 매번 확인해야 새 번들을 가리킨다.
    location = /pg/index.html {
        add_header Cache-Control "no-cache";
    }

    # 화면 전환이 history 기반이라 경로가 늘 /pg/ 지만, 직접 주소를 쳤을 때도 앱이 뜨게 한다.
    location /pg/ {
        try_files $uri $uri/ /pg/index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
