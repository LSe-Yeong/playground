# 한 오리진에 프론트와 API 를 함께 올린다. 세션 쿠키가 SameSite=Lax 라
# 둘이 다른 사이트면 쿠키가 아예 실리지 않는다.
#
# 백엔드는 반드시 1개다. 세션·소켓·광장이 전부 JVM 메모리에 있어
# 2개로 늘리면 광장이 갈라지고 REST 와 소켓이 서로 다른 인스턴스에 붙는다.

services:
  mysql:
    image: mysql:8.4
    # 아바타가 이모지라 utf8mb4 가 아니면 저장할 때 깨진다.
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-playground}
      MYSQL_USER: ${MYSQL_USER:-playground}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-playgroundpw}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      # 데이터 디렉터리가 비어 있을 때 한 번만 실행된다. 스키마가 바뀌면 볼륨을 지워야 다시 돈다.
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./playgroundback
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-playground}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-playground}
      DB_PASSWORD: ${MYSQL_PASSWORD:-playgroundpw}
      # 리스트 속성은 환경변수 이름 규칙이 헷갈려 JSON 으로 통째로 넘긴다.
      # allowed-origins 를 안 맞추면 소켓 핸드셰이크가 거부된다.
      SPRING_APPLICATION_JSON: >-
        {"playground":{"allowed-origins":["${PUBLIC_ORIGIN:-http://localhost}"],
        "session":{"cookie-secure":${COOKIE_SECURE:-false}}}}
    depends_on:
      mysql:
        condition: service_healthy
    # 포트를 밖으로 열지 않는다. nginx 를 우회해 http 로 직접 붙으면 쿠키가 안 실려
    # "어떤 사람은 되고 어떤 사람은 안 되는" 현상이 난다.
    expose:
      - "8081"
    restart: unless-stopped

  frontend:
    build:
      context: ./playgroundfront
      args:
        # 번들에 문자열로 박힌다. 도메인이 바뀌면 다시 빌드해야 한다.
        VITE_API_BASE: ${PUBLIC_ORIGIN:-http://localhost}/pg/api
    expose:
      - "5174"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    # 루프백에만 묶는다. 앞단(호스트 nginx)이 TLS 를 끝내고 넘기므로, 밖에서 이 포트로
    # 직접 들어오면 Secure 쿠키가 실리지 않아 앱이 반만 동작한다.
    ports:
      - "127.0.0.1:${EDGE_PORT:-8090}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  mysql-data:
