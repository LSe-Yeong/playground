# 앞단 nginx — 한 오리진에서 프론트와 API 를 함께 내보낸다.
# 같은 오리진이어야 세션 쿠키(SameSite=Lax)가 실린다.

# 도커 내부 DNS. 컨테이너를 다시 띄우면 IP 가 바뀌는데, nginx 는 기동 시점에 한 번만
# 이름을 풀기 때문에 그대로 두면 재배포 후 502 가 계속 난다. 아래처럼 변수로 넘기면
# 요청마다 다시 푼다. 변수를 쓰면 URI 가 날아가므로 $request_uri 를 붙여 준다.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # 좌표가 100ms 마다 오가므로 작은 프레임이 끊기지 않게 한다.
    tcp_nodelay on;

    # ---------- WebSocket ----------
    # prefix 가 더 길어 아래 /pg/api/ 보다 먼저 잡힌다 (nginx 는 가장 긴 prefix 가 이긴다).
    location /pg/api/ws {
        set $ws_backend backend;
        proxy_pass http://$ws_backend:8081$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 서버가 30초마다 ping 을 보내지만 기본 60초는 빠듯하다.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 음원 ----------
    # 한 곡이 3MB 다. 버퍼링을 켜 두면 통째로 받아 두고 내보내 Range 요청(진행바 드래그)이 둔해진다.
    # 파일 내용이 바뀌지 않으므로 길게 캐시한다 — 이게 없으면 곡이 바뀔 때마다 사람 수만큼 3MB 가 나간다.
    location /pg/api/audio/ {
        set $audio_backend backend;
        proxy_pass http://$audio_backend:8081$request_uri;

        proxy_buffering off;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---------- API ----------
    # Spring 의 context-path 가 /pg/api 다. prefix 를 떼고 넘기면 Spring 이 404 를 낸다.
    # $request_uri 를 그대로 넘기므로 경로가 보존된다.
    location /pg/api/ {
        set $api_backend backend;
        proxy_pass http://$api_backend:8081$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 화면 ----------
    # /pg/api/ 가 더 긴 prefix 라 API 가 먼저 잡힌다 (nginx 는 가장 긴 prefix 가 이긴다).
    location /pg/ {
        set $spa frontend;
        proxy_pass http://$spa:5174$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 슬래시 없이 들어오면 붙여 준다. /pg 는 위 prefix 에 걸리지 않는다.
    location = /pg {
        return 301 /pg/;
    }

    # 루트로 들어온 사람을 앱으로 보낸다.
    location = / {
        return 302 /pg/;
    }
}
